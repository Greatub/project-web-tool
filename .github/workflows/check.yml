name: Public source checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run privacy
      - run: node scripts/privacy-check.cjs --tracked
      - run: node scripts/privacy-check.cjs --history
